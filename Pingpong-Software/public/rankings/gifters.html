<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PingPong Top Gifters</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}button{font:inherit;cursor:pointer}.page{min-height:100vh;padding-bottom:28px;background:radial-gradient(circle at 50% 12%,#e44a9b66,transparent 35%),linear-gradient(180deg,#43104f,#120718 85%)}.header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:28px}.title{font-size:25px;font-weight:900}.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff20;border:1px solid #ffffff45}.tabs{display:flex;margin:5px 14px 18px;background:#ffffff18;border-radius:30px;padding:5px}.tabs button{flex:1;border:0;background:transparent;color:#fff;padding:12px 7px;border-radius:25px;font-weight:800}.tabs button.active{background:#ffd54d;color:#38142f}.status{text-align:center;padding:30px 18px;opacity:.9}.error{color:#ffd2d2}.retry{margin-top:12px;border:0;border-radius:24px;padding:11px 24px;background:#ffd54d;color:#38142f;font-weight:900}.cards{padding:0 14px}.podium{display:flex;align-items:end;justify-content:center;gap:8px;padding:22px 8px}.person{width:32%;text-align:center}.avatar{margin:auto;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;border:4px solid #ffe37b;background:linear-gradient(145deg,#ffd86b,#8d4c99);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person:nth-child(2) .avatar{width:108px;height:108px;border-color:#ffd42e}.rank{margin:8px auto;background:#ffe05b;color:#7e244e;border-radius:18px;padding:5px 12px;font-weight:900;display:inline-block}.score{color:#ffe36a;font-weight:900;margin-top:7px}.name{font-weight:800;word-break:break-word}.list{margin:8px 14px;border-radius:22px;overflow:hidden;background:#fff;color:#333}.row{display:grid;grid-template-columns:35px 58px 1fr 82px;align-items:center;gap:9px;padding:13px 11px;border-bottom:1px solid #eee}.mini{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e7b76c;border:3px solid #c58ce4;overflow:hidden;font-weight:900}.mini img{width:100%;height:100%;object-fit:cover}.meta{font-size:12px;color:#777;margin-top:4px}.amount{text-align:right;color:#8b35c4;font-weight:900}.feature{margin:14px;border:2px solid #efc54c;border-radius:24px;padding:18px;background:#7c1b4caa}.room-podium{display:flex;justify-content:space-around;align-items:end;text-align:center;gap:8px}.room-card{width:31%}.room-badge{height:100px;border-radius:18px;background:linear-gradient(145deg,#7d4bd3,#ec9fca);border:3px solid #f7d86d;display:grid;place-items:center;font-size:25px;font-weight:900;overflow:hidden}.room-badge img{width:100%;height:100%;object-fit:cover}.room-name{font-weight:800;margin-top:7px;word-break:break-word}.room-score{color:#ffe46c;font-weight:900;margin-top:5px}.back{border:0;background:transparent;color:#fff;font-size:30px}body{background:#b64ca6}.page{background:linear-gradient(#f6a6d9,#b64ca6 50%,#7a2b8c)}</style></head><body><main class="page">
<header class="header"><button class="back" onclick="window.location.href='/'">‹</button><div class="title">Top Gifters</div><div class="icon">?</div></header><div style="display:flex;gap:8px;padding:0 14px 10px;flex-wrap:wrap"><a href="/club/" style="flex:1;text-align:center;text-decoration:none;color:#fff;background:#ffffff18;border:1px solid #ffffff30;border-radius:18px;padding:9px;font-weight:800">Club</a><a href="/rankings/cp.html" style="flex:1;text-align:center;text-decoration:none;color:#fff;background:#ffffff18;border:1px solid #ffffff30;border-radius:18px;padding:9px;font-weight:800">CP</a><a href="/rankings/rooms.html" style="flex:1;text-align:center;text-decoration:none;color:#fff;background:#ffffff18;border:1px solid #ffffff30;border-radius:18px;padding:9px;font-weight:800">Rooms</a><a href="/rankings/gifters.html" style="flex:1;text-align:center;text-decoration:none;color:#fff;background:#ffffff18;border:1px solid #ffffff30;border-radius:18px;padding:9px;font-weight:800">Gifters</a></div><div class="tabs"><button data-period="daily" class="active">Daily</button><button data-period="weekly">Weekly</button><button data-period="monthly">Monthly</button></div>
<section id="content"></section>
</main><script src="/socket.io/socket.io.js"></script><script>const ENDPOINT='gifters',EVENT='ranking:gifters:update';const state={period:'daily',data:[],loading:false,error:''};const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){n=Number(n)||0;if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.round(n))}
function avatar(u,cls='avatar'){return `<div class="${cls}">${u&&u.avatar?`<img src="${esc(u.avatar)}" alt="" onerror="this.remove()">`:esc((u&&u.name||'User').slice(0,1).toUpperCase())}</div>`}
async function load(){state.loading=true;state.error='';render();try{const token=localStorage.getItem('pp_auth_token')||'';const headers={Accept:'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch(`/api/rankings/${ENDPOINT}?period=${encodeURIComponent(state.period)}`,{credentials:'include',headers});if(r.status===401){/* Ranking pages are read-only: never clear the PingPong session or force logout here. */throw new Error('Ranking session check failed. Your PingPong login was kept; tap Retry to check again.')}if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'Unable to load ranking.')}const j=await r.json();state.data=j.ranking||[];state.loading=false;render()}catch(e){state.loading=false;state.error=e.message||'Unable to load ranking.';render()}}
function setupPeriods(){document.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{state.period=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));load()}))}
function setupSocket(){if(typeof io!=='function')return;try{const s=io();s.on(EVENT,p=>{if(p&&p.period===state.period){state.data=p.ranking||[];state.loading=false;state.error='';render()}})}catch(_){}}

function render(){const c=$('#content');if(state.loading){c.innerHTML='<div class="status">Loading ranking...</div>';return}if(state.error){c.innerHTML='<div class="status error">'+esc(state.error)+'<br><button class="retry" onclick="load()">Retry</button></div>';return}if(!state.data.length){c.innerHTML='<div class="status">No ranking data yet.</div>';return}const top=state.data.slice(0,3),rest=state.data.slice(3);let html='<section class="podium">'+top.map(r=>`<div class="person">${avatar(r.user)}<div class="rank">TOP ${r.rank}</div><div class="name">${esc(r.user.name)}</div><div class="meta">Lv.${r.user.level} • VIP ${r.user.vipLevel}${r.user.svipLevel?' • SVIP '+r.user.svipLevel:''}</div><div class="score">${fmt(r.totalValue)} 💎</div></div>`).join('')+'</section>';if(rest.length)html+='<section class="list">'+rest.map(r=>`<div class="row"><b>${r.rank}</b>${avatar(r.user,'mini')}<div><div class="name">${esc(r.user.name)}</div><div class="meta">Lv.${r.user.level} • VIP ${r.user.vipLevel} • ${r.giftCount} gifts</div></div><div class="amount">${fmt(r.totalValue)} 💎</div></div>`).join('')+'</section>';c.innerHTML=html}
setupPeriods();load();setupSocket();</script></body></html>
