org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true

# --- Termux / on-device ARM64 build support -------------------------------
# AGP downloads a Linux x86_64 ELF aapt2 binary from Maven and tries to exec
# it directly. On Termux (Android/aarch64) that binary cannot run, and the
# shell falls back to interpreting the ELF bytes as a shell script, which is
# where the "Syntax error: '(' unexpected" comes from. Once aapt2 fails like
# this, resource compilation/linking is broken too, which is what produces
# the downstream "No package ID 7f found for resource ID 0x..." errors -
# those are a *symptom*, not a separate bug, so they are not fixed by
# touching any 0x7f IDs.
#
# The fix is to point AGP at the native aapt2 binary Termux already ships,
# instead of the incompatible one from Maven.
#
# Default assumes the standard Termux app prefix. If your device/build uses
# a different prefix, override this on the command line instead of editing
# this file, e.g.:
#   ./gradlew clean assembleRelease -Pandroid.aapt2FromMavenOverride=$PREFIX/bin/aapt2
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
