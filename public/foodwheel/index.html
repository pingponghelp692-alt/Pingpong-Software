<script>

  // ---- Room-host integration bridge (PingPong app wiring) ----
  // Talks to the parent page over postMessage using the FOODWHEEL_*/
  // FRUITWHEEL_* protocol the room's coin wallet, sync, and close button
  // already expect. This script never decides a balance, a phase, or a
  // winner itself — it only relays what the parent (ultimately the
  // server) tells it, and forwards the player's own bet taps upward for
  // the server to validate and settle.
  (function () {
    var inited = false;

    function getCtrl() {
      return window.FruitGameControl || window.FruitGame || null;
    }

    var gateEl = document.getElementById("fw-loading-gate");
    var gateCleared = false;
    function clearGate() {
      if (gateCleared || !gateEl) return;
      gateCleared = true;
      gateEl.style.display = "none";
    }

    function waitForControl(cb, attemptsLeft) {
      var ctrl = getCtrl();
      if (ctrl) { cb(ctrl); return; }
      if (attemptsLeft <= 0) return;
      setTimeout(function () { waitForControl(cb, attemptsLeft - 1); }, 50);
    }

    var lastServerBalance = null;
    var justInitedValue = null;

    window.addEventListener("message", function (ev) {
      var data = ev && ev.data;
      if (!data || data.type !== "FOODWHEEL_INIT") return;
      var bal = Math.max(0, Math.floor(Number(data.balance) || 0));
      inited = true;
      lastServerBalance = bal;
      justInitedValue = bal;
      waitForControl(function (ctrl) {
        if (typeof ctrl.setBalance === "function") ctrl.setBalance(bal);
        clearGate();
      }, 40);
    });

    // Fail-safe: if the parent page never completes the FOODWHEEL_INIT
    // handshake, keep the loading gate up rather than showing a balance of
    // 0 as if it were real.
    setTimeout(function () {
      if (!gateCleared) {
        console.error("[LuckyFruit] Server wallet never arrived (no FOODWHEEL_INIT) — keeping game hidden.");
      }
    }, 10000);

    waitForControl(function (ctrl) {
      if (typeof ctrl.onBalanceChange === "function") {
        ctrl.onBalanceChange(function (bal) {
          if (!inited) return;
          if (justInitedValue !== null && bal === justInitedValue) {
            justInitedValue = null;
            return;
          }
          try {
            window.parent.postMessage({ type: "FOODWHEEL_BALANCE", balance: bal }, "*");
          } catch (e) {}
        });
      }
      if (typeof ctrl.onBet === "function") {
        ctrl.onBet(function (bet) {
          try {
            window.parent.postMessage({ type: "FOODWHEEL_BET", foodId: bet.foodId, amount: bet.amount }, "*");
          } catch (e) {}
        });
      }
      try {
        window.parent.postMessage({ type: "FOODWHEEL_READY" }, "*");
      } catch (e) {}
    }, 100);

    // ---- Server-authoritative round sync ----
    // Every field used below (phase, resultFoodId, endsInMs, myBets, and
    // the winners list) comes straight from the server's fruitwheel-round /
    // fruitwheel-winners broadcasts via app.js — this bridge only relays it
    // into whichever control methods the game exposes for that purpose.
    function fmtShort(n) {
      // CENTRALIZED (2026-08-05): delegates to the same pp_fmt() the main
      // game module uses (exposed on window), so every screen — chip
      // selector, TODAY'S WIN bar, balance chip, winners panel, history —
      // formats numbers identically. No separate copy of the K/M logic
      // left here; this is now just a thin wrapper (kept under its
      // original name in case anything else in this file still calls it).
      if (typeof window.pp_fmt === "function") return window.pp_fmt(n);
      n = Number(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1).replace(/\.0$/, "") + "M";
      if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1).replace(/\.0$/, "") + "K";
      return String(n);
    }
    var RANK_COLORS = ["#FFD700", "#C0C0C0", "#CD7F32"];
    var lastForcedResult = null;
    var currentRoundId = 0;
    var currentWinnerRoundId = 0;
    var currentMyResultRoundId = 0;

    window.addEventListener("message", function (ev) {
      var data = ev && ev.data;
      if (!data) return;

      if (data.type === "FRUITWHEEL_ROUND") {
        var incomingRoundId = Number(data.roundId) || 0;
        // Ignore stale/replayed round packets. A reconnect can deliver an
        // older iframe message after the newest state has already rendered.
        // The server is authoritative; the roundId is the ordering key.
        if (incomingRoundId && currentRoundId && incomingRoundId < currentRoundId) return;
        if (incomingRoundId > currentRoundId) {
          currentRoundId = incomingRoundId;
          lastForcedResult = null;
        }
        waitForControl(function (ctrl) {
          if (typeof ctrl.setRoundId === "function") ctrl.setRoundId(currentRoundId);
        }, 20);
        if (typeof data.endsInMs === "number") {
          var endsAt = Date.now() + data.endsInMs;
          waitForControl(function (ctrl) {
            if (typeof ctrl.syncRoundEnd === "function") ctrl.syncRoundEnd(endsAt);
          }, 20);
        }

        if (data.phase === "betting") {
          lastForcedResult = null;
          waitForControl(function (ctrl) {
            if (typeof ctrl.clearForced === "function") ctrl.clearForced();
            if (typeof ctrl.setPhase === "function") ctrl.setPhase("betting", null, data.myBets || {});
          }, 20);
        }

        if (data.phase === "spinning" && data.resultFoodId) {
          if (lastForcedResult !== data.resultFoodId) {
            lastForcedResult = data.resultFoodId;
            waitForControl(function (ctrl) {
              if (typeof ctrl.forceResult === "function") ctrl.forceResult(data.resultFoodId);
            }, 20);
          }
          waitForControl(function (ctrl) {
            if (typeof ctrl.setPhase === "function") ctrl.setPhase("spinning", data.resultFoodId);
          }, 20);
        }

        if (data.phase === "result" && data.resultFoodId) {
          waitForControl(function (ctrl) {
            if (typeof ctrl.setPhase === "function") ctrl.setPhase("result", data.resultFoodId);
          }, 20);
        }
      }

      if (data.type === "FRUITWHEEL_WINNERS") {
        var winnerRoundId = Number(data.roundId) || 0;
        if (winnerRoundId && currentRoundId && winnerRoundId !== currentRoundId) return;
        if (winnerRoundId) currentWinnerRoundId = winnerRoundId;
        var wins = Array.isArray(data.winners) ? data.winners : [];
        var top = wins.slice(0, 3).map(function (w, idx) {
          return { crown: idx + 1, name: w.name, win: Number(w.amount) || 0, avatarUrl: w.photo || w.avatar || null, avatar: (w.name || "?").trim().charAt(0).toUpperCase(), color: RANK_COLORS[idx] || "#8ED2FF" };
        });
        waitForControl(function (ctrl) {
          if (typeof ctrl.setTopWinners === "function") ctrl.setTopWinners(top);
        }, 20);
      }

      if (data.type === "FRUITWHEEL_MY_RESULT") {
        var resultRoundId = Number(data.roundId) || 0;
        if (resultRoundId && currentRoundId && resultRoundId !== currentRoundId) return;
        if (resultRoundId) currentMyResultRoundId = resultRoundId;
        // Real, targeted, per-user outcome the server just resolved for
        // this exact bettor — the only thing the game is allowed to show
        // for "did I win / how much" now.
        waitForControl(function (ctrl) {
          if (typeof ctrl.setMyResult === "function") {
            ctrl.setMyResult({
              roundId: resultRoundId,
              foodId: data.foodId,
              hasBet: !!data.hasBet,
              betTotal: Number(data.betTotal) || 0,
              win: Number(data.win) || 0
            });
          }
        }, 20);
      }

      if (data.type === "FRUITWHEEL_BET_ACK" || data.type === "FRUITWHEEL_BET_REJECTED") {
        var ackRoundId = Number(data.roundId) || 0;
        if (ackRoundId && currentRoundId && ackRoundId !== currentRoundId) return;
        waitForControl(function (ctrl) {
          if (typeof ctrl.setAuthoritativeBetState === "function") {
            ctrl.setAuthoritativeBetState(data.myBets || {}, Number(data.balance) || 0);
          }
        }, 20);
      }

      if (data.type === "FRUITWHEEL_LEADERBOARD") {
        // Real, persistent, server-computed Jackpot Ranking — never
        // generated or randomized on the client.
        var board = Array.isArray(data.leaderboard) ? data.leaderboard : [];
        waitForControl(function (ctrl) {
          if (typeof ctrl.setLeaderboard === "function") {
            ctrl.setLeaderboard(board, Number(data.poolTotal) || 0);
          }
        }, 20);
      }
    });

    // Re-assert the real balance whenever the tab/iframe regains
    // visibility, in case anything reset local state while hidden.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible" || lastServerBalance === null) return;
      waitForControl(function (ctrl) {
        if (typeof ctrl.getBalance === "function" && typeof ctrl.setBalance === "function" && ctrl.getBalance() !== lastServerBalance) {
          justInitedValue = lastServerBalance;
          ctrl.setBalance(lastServerBalance);
        }
      }, 5);
    });
  })();

  </script>
</body>
</html>
