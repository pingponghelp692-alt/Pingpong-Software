  <script>
(function(){
  const nativeFetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    init=init?{...init}:{ };
    const h=new Headers(init.headers||{});
    const t=(window.parent&&window.parent!==window?window.parent.localStorage.getItem("pp_auth_token"):localStorage.getItem("pp_auth_token"))||"";
    if(t&&!h.has("Authorization")) h.set("Authorization","Bearer "+t);
    if(!init.credentials) init.credentials="include";
    init.headers=h;
    return nativeFetch(input,init);
  };
  window.__ppOpenPaymentApp=function(link,method){
    if(!link) return false;
    const generic=link.replace(/^phonepe:\/\/pay\?/i,"upi://pay?").replace(/^paytmmp:\/\/pay\?/i,"upi://pay?").replace(/^tez:\/\/upi\/pay\?/i,"upi://pay?");
    const preferred=method==="phonepe"||method==="paytm"||method==="gpay"?link:generic;
    let launched=false;
    const mark=()=>{launched=true;};
    document.addEventListener("visibilitychange",mark,{once:true});
    window.addEventListener("pagehide",mark,{once:true});
    const a=document.createElement("a");
    a.href=preferred; a.style.display="none"; a.rel="noopener";
    document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=preferred;}catch(_){}}
    setTimeout(function(){
      if(!launched){
        try{window.location.href=preferred;}catch(e){}
        setTimeout(function(){if(!launched){try{window.location.href=generic;}catch(e){}}},500);
      }
      try{a.remove();}catch(e){}
    },500);
    return true;
  };
})();
